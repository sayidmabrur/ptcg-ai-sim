# Render blueprint: deploys the image published by
# .github/workflows/docker-publish.yml, not a build from source.
#
# Each active game costs ~1 GB RAM (a worker process plus a torch process,
# per simulator/deploy/Dockerfile). The "standard" plan gives 2 GB, so
# PTCG_MAX_SESSIONS is capped at 2 here — raise both together if you move
# to a bigger plan.
services:
  - type: web
    name: ptcg-ai-sim
    runtime: image
    image:
      url: ghcr.io/sayidmabrur/ptcg-ai-sim:latest
    plan: standard
    envVars:
      - key: PTCG_MAX_SESSIONS
        value: "2"
      - key: PTCG_IDLE_TIMEOUT
        value: "900"
